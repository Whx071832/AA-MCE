[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-mce"
version = "0.1.0"
description = "Availability-aware multi-capacity ensemble (AA-MCE) for social music tag mining under missing modalities: experiment and reporting code"
readme = "README.md"
requires-python = ">=3.10"
# License: MIT, see LICENSE (bundled automatically; not repeated here so the file
# builds with both pre- and post-PEP 639 versions of setuptools).
authors = [{ name = "The AA-MCE Authors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.12",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools]
# The code runs from the repository root (`python -m src.experiments.<runner>`)
# and is not installed as an importable package; `pip install .` installs the
# declared dependencies only.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
